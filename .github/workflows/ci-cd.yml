```yaml
name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Tạo student.env từ GitHub Secrets
        env:
          STUDENT_NAME: ${{ secrets.STUDENT_NAME }}
          STUDENT_ID: ${{ secrets.STUDENT_ID }}
          STUDENT_CLASS: ${{ secrets.STUDENT_CLASS }}
          STUDENT_EMAIL: ${{ secrets.STUDENT_EMAIL }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        run: |
          set -e
          for v in STUDENT_NAME STUDENT_ID STUDENT_CLASS STUDENT_EMAIL MYSQL_USER MYSQL_PASSWORD MYSQL_ROOT_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Chưa cấu hình GitHub Secret $v"
              exit 1
            fi
          done

          {
            printf 'STUDENT_NAME=%s\n' "$STUDENT_NAME"
            printf 'STUDENT_ID=%s\n' "$STUDENT_ID"
            printf 'STUDENT_CLASS=%s\n' "$STUDENT_CLASS"
            printf 'STUDENT_EMAIL=%s\n' "$STUDENT_EMAIL"
            printf 'GITHUB_USERNAME=%s\n' "$GITHUB_REPOSITORY_OWNER"
            printf 'APP_PORT=8081\n'
            printf 'COMPOSE_PROJECT_NAME=binh2810-de00101\n'
            printf 'MYSQL_USER=%s\n' "$MYSQL_USER"
            printf 'MYSQL_PASSWORD=%s\n' "$MYSQL_PASSWORD"
            printf 'MYSQL_ROOT_PASSWORD=%s\n' "$MYSQL_ROOT_PASSWORD"
          } > student.env

          chmod 600 student.env
          echo "### Đã tạo cấu hình cho sinh viên" >> "$GITHUB_STEP_SUMMARY"

      - name: Đặt tên image
        id: meta
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}/app" >> "$GITHUB_OUTPUT"

      - name: Build & chạy thử bằng Docker Compose
        env:
          APP_IMAGE: ${{ steps.meta.outputs.image }}
          APP_TAG: ${{ github.sha }}
          APP_VERSION: ${{ github.sha }}
        run: |
          docker compose --env-file student.env up -d --build --wait --wait-timeout 600

      - name: Smoke test
        run: |
          set -a
          source student.env
          set +a

          BASE="http://localhost:${APP_PORT}"
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors \
            "$BASE/api/labs" | grep -q '"id"'
          echo "Smoke test OK"

      - name: In log khi lỗi
        if: failure()
        run: |
          if [ -f student.env ]; then
            docker compose --env-file student.env logs --no-color || true
          fi

      - name: Đăng nhập GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image lên GHCR
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:latest"

      - name: Dọn dẹp
        if: always()
        run: |
          if [ -f student.env ]; then
            docker compose --env-file student.env down -v || true
          fi

  deploy:
    name: Deploy lên server
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy qua SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ needs.build.outputs.image }}
          APP_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          DEPLOY_DIR: ${{ github.event.repository.name }}
          STUDENT_NAME: ${{ secrets.STUDENT_NAME }}
          STUDENT_ID: ${{ secrets.STUDENT_ID }}
          STUDENT_CLASS: ${{ secrets.STUDENT_CLASS }}
          STUDENT_EMAIL: ${{ secrets.STUDENT_EMAIL }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: APP_IMAGE,APP_TAG,GHCR_USER,GHCR_TOKEN,REPO_URL,DEPLOY_DIR,STUDENT_NAME,STUDENT_ID,STUDENT_CLASS,STUDENT_EMAIL,MYSQL_USER,MYSQL_PASSWORD,MYSQL_ROOT_PASSWORD
          script: |
            set -e
            DEPLOY_PATH="$HOME/$DEPLOY_DIR"

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              git clone "$REPO_URL" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main

            umask 077
            {
              printf 'STUDENT_NAME=%s\n' "$STUDENT_NAME"
              printf 'STUDENT_ID=%s\n' "$STUDENT_ID"
              printf 'STUDENT_CLASS=%s\n' "$STUDENT_CLASS"
              printf 'STUDENT_EMAIL=%s\n' "$STUDENT_EMAIL"
              printf 'GITHUB_USERNAME=%s\n' "$GHCR_USER"
              printf 'APP_PORT=8081\n'
              printf 'COMPOSE_PROJECT_NAME=binh2810-de00101\n'
              printf 'MYSQL_USER=%s\n' "$MYSQL_USER"
              printf 'MYSQL_PASSWORD=%s\n' "$MYSQL_PASSWORD"
              printf 'MYSQL_ROOT_PASSWORD=%s\n' "$MYSQL_ROOT_PASSWORD"
            } > student.env

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            export APP_IMAGE APP_TAG
            docker compose --env-file student.env pull app
            docker compose --env-file student.env up -d --no-build --wait --wait-timeout 300
            docker logout ghcr.io
            docker compose --env-file student.env ps
```